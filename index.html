<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"> -->
    <!-- datatables -->
    <link rel="stylesheet" href="//cdn.datatables.net/2.3.7/css/dataTables.dataTables.min.css">
    <link rel="stylesheet" href="//cdn.datatables.net/2.3.7/js/dataTables">
    <!-- fontawesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">POS</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="register.html">Register</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="login.html">Login</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="product.html">Products</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="sales.html">Sales</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

    </div>

    <div class="container" id="app">
        <!--v-model is for binding two data  -->
        <!-- v-for is for looping -->
        <form name="form" @submit.prevent="registerUser">
            <div class="mb-3">
                <label for="fname" class="form-label">Full Name</label>
                <input type="text" v-model="fname" class="form-control" id="fname">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="text" v-model="email" class="form-control" id="email">
            </div>
            <!-- <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" v-model="password" class="form-control" id="password">
            </div> -->
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>

        <div class="alert alert-success" v-if="alertSuccessShow" role="alert">
            {{alertMessage}}
        </div>
        <div class="alert alert-danger" v-if="alertErrorShow" role="alert">
            {{alertMessage}}
        </div>

        <table id="example" class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Full Name</th>
                    <th scope="col">Email</th>
                    <!-- <th scope="col">Password</th> -->
                </tr>
            </thead>
            <tbody>
                <tr v-for="user in users" :key="user.id">
                    <th scope="row">{{ user.id }}</th>
                    <td>{{ user.full_name }}</td>
                    <td>{{ user.email }}</td>
                    <!-- <td>******</td> -->
                </tr>
            </tbody>
        </table>
    </div>

    <!-- jsquery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.0/jquery.min.js"
        integrity="sha512-Pa4Jto+LuCGBHy2/POQEbTh0reuoiEXQWXGn8S7aRlhcwpVkO8+4uoZVSOqUjdCsE+77oygfu2Tl+7qGHGIWsw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- datatable -->
    <script src="https://cdn.datatables.net/2.3.7/js/dataTables.js"></script>
    <!-- vue cdn -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.7.16/vue.min.js"
        integrity="sha512-Wx8niGbPNCD87mSuF0sBRytwW2+2ZFr7HwVDF8krCb3egstCc4oQfig+/cfg2OHd82KcUlOYxlSDAqdHqK5TCw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- axios cdn -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.8/axios.js"
        integrity="sha512-+dJa1RvuE8/HFftifMtr7hqixdEkb/DizfXUZAA0pyZeVdNnyZyKy9RnIWi0JSWUznbCNbaQNn0E6nbtrdL+9g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- bootstrap  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

    <!-- vue is a js framework that's why we use a script -->
    <script>
        new Vue({
            el: "#app",
            // data is used to store our variables
             //data stores values that vue shows and updates on the screen
            //  data returns an object containing values you want displayed in html
            data: {
                fname: "",
                email: "",
                alertSuccessShow: false,
                alertErrorShow: false,
                alertMessage: "",
                users: [],
                token: "",
                header: {}
            },
            methods: {
                async registerUser() {
                    // async used to handle operations that take time without blocking your program
                    // this is a keyword used to reference different variables in the data
                    if (this.fname == "" || this.email == "" || this.password == "") {
                        this.alertErrorShow = true;
                        this.alertMessage = "Ensure all fields are filled!!!"
                    } else {
                        //axios is a js library used for request handling between vue and flaskapi
                        this.header = {
                            Authorization: "Bearer " + this.token
                        }
                        console.log("header is ", this.header)
                        axios.post("http://127.0.0.1:5000/users", {
                            full_name: this.fname,
                            email: this.email,
                            // password: this.password
                            password: "123456"
                        }, { headers: this.header })
                            .then((response) => {
                                // console.log(response.data);
                                console.log("FULL RESPONSE:", response.data);
                                this.alertErrorShow = false;
                                this.alertSuccessShow = true;
                                this.alertMessage = "User added successfully";
                                setTimeout(() => {
                                    location.reload();
                                }, 3000);
                            })
                            .catch((error) => {
                                console.error("Error registering user:", error);
                                this.alertErrorShow = true;
                                this.alertSuccessShow = false;
                                // this.alertMessage = error;
                                this.alertMessage = error.response?.data?.error || error.message;
                                console.log(error.response.data)
                            });
                    }
                },
                getUser() {
                    this.header = {
                        Authorization: "Bearer " + this.token
                    }
                    console.log("header is", this.header)
                    console.log(localStorage.getItem("token"))
                    axios.get("http://127.0.0.1:5000/users", { headers: this.header })
                        .then((response) => {
                            console.log(response.data.data);
                            this.users = response.data.data;
                            // this.$nextTick(() => {
                            //     $('#example').DataTable();
                            // });
                            this.$nextTick(() => {
                                if ($.fn.DataTable.isDataTable('#example')) {
                                    $('#example').DataTable().destroy();
                                }
                                $('#example').DataTable();
                            });
                        })
                        .catch((error) => {
                            this.alertErrorShow = true;
                            this.alertSuccessShow = false;
                            this.alertMessage = "Something went wrong.";
                        });
                },
            },
            mounted() {
                if (localStorage.getItem("token") != null) {
                    this.token = localStorage.getItem("token")
                    console.log("Token:", this.token);
                    this.getUser()
                } else {
                    window.location.href = "register.html"
                }
            },
        });
    </script>

</body>

</html>
